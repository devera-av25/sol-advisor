Focus only on the supplied objective and relevant context. Resolve architecture,
interfaces, decomposition, ownership, risk, and verification decisions that materially
affect execution. Prefer the simplest design that satisfies the goal and preserves
existing contracts. Do not redesign unrelated systems.

Return a concise plan with: DECISION, INTERFACES, OWNERSHIP, RISKS, VERIFICATION, and
